# Runs one submission commit for the fixed budget and verifies what it left.
#
# Trust boundary: everything in this job runs as the `runner` user except the
# build and execution of `bench`, which is the only binary that links the
# submission. Those run as the unprivileged `contestant` user with no network.
# The scored basis is whatever `contestant` had written to disk when the
# budget (plus the harness grace) elapsed: at that moment the sandbox cgroup
# is frozen, the file is imported if it is a plain regular file of sane size,
# and the trusted `runner verify` scores the imported copy.
# Nothing the sandboxed process prints or writes afterwards affects the score.
#
# Publication is the second job of this workflow rather than a workflow_run
# listener: GitHub suppresses workflow_run events for runs dispatched with
# GITHUB_TOKEN, which is how intake dispatches this one. The job has its own
# token and VM; it never touches contestant code, only the artifact.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Submission commit (on a submissions/pr-<n> branch)
        required: true
      pr:
        description: Pull request number
        required: true
      secs:
        description: Budget override in seconds (smoke tests only)
        default: ""
      n:
        description: Instance n override (smoke tests only)
        default: ""
      m:
        description: Instance m override (smoke tests only)
        default: ""
  # Lets a workflow on a feature branch exercise this one before it reaches
  # main, where workflow_dispatch becomes available.
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      pr:
        type: string
        required: true
      secs:
        type: string
        default: ""
      n:
        type: string
        default: ""
      m:
        type: string
        default: ""

permissions:
  contents: read

env:
  COMMIT: ${{ inputs.commit }}
  PR: ${{ inputs.pr }}
  SECS: ${{ inputs.secs || vars.BENCH_SECS || '7200' }}
  GRACE_SECS: 5
  # Backstop only: the harness enforces the budget; this kills a process that
  # ignores it while still leaving time for a normal exit.
  KILL_AFTER_SECS: 900
  WORK: /work
  OUT: /work/out
  # Every sandboxed process lives in this cgroup (root-owned, not delegated,
  # so the contestant can neither leave it nor touch its control files).
  # Freezing it stops every process in it until it is thawed, unlike SIGSTOP,
  # which a pre-armed timer signalling SIGCONT undoes.
  CGROUP: /sys/fs/cgroup/contestant
  CARGO_TERM_COLOR: never

jobs:
  bench:
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    # One run at a time, every queued run kept: timings are only comparable
    # on an idle machine, and an approved run must never be dropped.
    concurrency:
      group: benchmark
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # One commit on top of main touching only submission/, holding only
      # regular files: no symlinks or submodules that could point the build or
      # the metadata copy at something outside the submission.
      - name: Check this is a submission commit
        run: |
          git fetch --no-tags origin main
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          parent=$(git rev-parse HEAD^)
          git merge-base --is-ancestor "$parent" origin/main
          test -z "$(git diff --name-only "$parent" HEAD | grep -v '^submission/' || true)"
          test -z "$(git ls-tree -r HEAD submission | awk '$1 != "100644" && $1 != "100755"')"

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo fetch --locked

      - name: Build the trusted runner
        run: cargo build --release --locked --offline -p runner

      - name: Create the sandbox user
        run: |
          sudo useradd --system --create-home --shell /usr/sbin/nologin contestant
          sudo iptables -I OUTPUT -m owner --uid-owner contestant -j REJECT
          sudo ip6tables -I OUTPUT -m owner --uid-owner contestant -j REJECT
          chmod o+x "$HOME" && chmod -R a+rX "$HOME/.rustup"
          sudo mkdir -p "$WORK/src" "$WORK/.cargo" "$OUT"
          sudo rsync -a --exclude target --exclude .git ./ "$WORK/src/"
          sudo cp -r "$HOME/.cargo/registry" "$WORK/.cargo/registry"
          sudo chown -R contestant:contestant "$WORK"
          sudo mkdir "$CGROUP"
          test -f "$CGROUP/cgroup.freeze"
          toolchain_bin=$(dirname "$(rustup which cargo)")
          sudo tee /usr/local/bin/sandboxed >/dev/null <<EOF
          #!/bin/sh
          echo \$\$ > "$CGROUP/cgroup.procs"
          exec sudo -u contestant env HOME=/home/contestant PATH="$toolchain_bin:/usr/bin:/bin" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$WORK/.cargo" "\$@"
          EOF
          sudo chmod 755 /usr/local/bin/sandboxed
          echo "SANDBOX=sudo /usr/local/bin/sandboxed" >> "$GITHUB_ENV"
          sudo /usr/local/bin/sandboxed sh -c 'curl -sS --max-time 5 https://api.github.com >/dev/null 2>&1 && exit 1 || echo "network blocked"'
          sudo /usr/local/bin/sandboxed sh -c 'test "$(cat /proc/self/cgroup)" = "0::/contestant" && ! echo 0 > '"$CGROUP"'/cgroup.freeze 2>/dev/null && echo "cgroup confined"'

      # Contestant output reaches the job log only between stop-commands
      # markers, so it cannot issue workflow commands.
      - name: Build the submission (sandboxed)
        run: |
          cd "$WORK/src"
          guard=$(openssl rand -hex 16)
          echo "::stop-commands::$guard"
          $SANDBOX cargo build --release --locked --offline -p bench 2>&1 | tail -n 40
          echo "::$guard::"
          test -x "$WORK/src/target/release/bench"
          # Nothing a build script started survives into the run.
          echo 1 | sudo tee "$CGROUP/cgroup.kill" >/dev/null
          test -z "$(cat "$CGROUP/cgroup.procs")"

      - name: Derive the seed from drand
        id: seed
        run: |
          beacon=$(curl -fsS --retry 5 --retry-delay 10 https://api.drand.sh/public/latest)
          round=$(echo "$beacon" | jq -r .round)
          randomness=$(echo "$beacon" | jq -r .randomness)
          seed=$(target/release/runner seed --randomness "$randomness" --commit "$COMMIT")
          echo "round=$round" >> "$GITHUB_OUTPUT"
          echo "randomness=$randomness" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "drand round $round, seed $seed"

      - name: Run the submission (sandboxed)
        id: run
        env:
          SEED: ${{ steps.seed.outputs.seed }}
          N: ${{ inputs.n }}
          M: ${{ inputs.m }}
        run: |
          mkdir -p trusted
          instance_flags=""
          if [ -n "$N" ]; then instance_flags="--n $N --m $M"; fi
          started=$(date -u +%FT%TZ)
          echo "started=$started" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2086
          $SANDBOX timeout -s KILL $((SECS + KILL_AFTER_SECS)) \
            "$WORK/src/target/release/bench" --seed "$SEED" --secs "$SECS" $instance_flags \
            --snapshot-secs 10 --basis "$OUT/basis.bin" --report "$OUT/report.json" --events "$OUT/events.jsonl" \
            > trusted/bench.log 2>&1 &
          bench_pid=$!

          # Freezes the sandbox cgroup and returns once the kernel reports
          # every process in it frozen; nothing in it runs again until thawed.
          freeze() {
            echo 1 | sudo tee "$CGROUP/cgroup.freeze" >/dev/null
            for _ in $(seq 600); do
              grep -q '^frozen 1$' "$CGROUP/cgroup.events" && return 0
              sleep 0.1
            done
            echo "sandbox did not freeze"
            return 1
          }
          thaw() { echo 0 | sudo tee "$CGROUP/cgroup.freeze" >/dev/null; }

          # Imports a sandbox file, to be called only while frozen. Only plain
          # regular files within the size bound are accepted, read as the
          # sandbox user (outside the cgroup) so a link to anything else on
          # the host is unreadable rather than copied.
          import_file() {
            local src=$1 dst=$2 max=$3 kind size
            kind=$(sudo -u contestant stat -c %F -- "$src" 2>/dev/null) || { echo "$src: missing"; return 1; }
            size=$(sudo -u contestant stat -c %s -- "$src")
            if [ "$kind" != "regular file" ] || [ "$size" -gt "$max" ]; then
              echo "$src: refused ($kind, $size bytes)"
              return 1
            fi
            sudo -u contestant cat -- "$src" > "$dst"
          }

          sleep $((SECS + GRACE_SECS + 10))
          if freeze; then
            import_file "$OUT/basis.bin" trusted/basis.bin $((256 * 1024 * 1024)) || true
          fi
          thaw
          echo "basis taken at $(date -u +%FT%TZ)"

          wait $bench_pid && status=0 || status=$?
          echo "bench exit $status"
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          echo "finished=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          if freeze; then
            import_file "$OUT/report.json" trusted/report.json $((64 * 1024 * 1024)) || true
            import_file "$OUT/events.jsonl" trusted/events.jsonl $((64 * 1024 * 1024)) || true
          fi
          echo 1 | sudo tee "$CGROUP/cgroup.kill" >/dev/null
          guard=$(openssl rand -hex 16)
          echo "::stop-commands::$guard"
          tail -n 5 trusted/bench.log || true
          echo "::$guard::"
          test -s trusted/basis.bin

      - name: Verify (trusted)
        id: verify
        env:
          SEED: ${{ steps.seed.outputs.seed }}
          N: ${{ inputs.n }}
          M: ${{ inputs.m }}
        run: |
          instance_flags=""
          if [ -n "$N" ]; then instance_flags="--n $N --m $M"; fi
          # shellcheck disable=SC2086
          target/release/runner verify --seed "$SEED" $instance_flags \
            --basis trusted/basis.bin --score trusted/score.json && echo "status=accepted" >> "$GITHUB_OUTPUT" || echo "status=rejected" >> "$GITHUB_OUTPUT"
          test -s trusted/score.json

      # Always written, so that publish can record a failed run against its
      # pull request even when an earlier step aborted.
      - name: Record metadata
        if: always()
        env:
          PR_INPUT: ${{ inputs.pr }}
          STARTED: ${{ steps.run.outputs.started }}
          FINISHED: ${{ steps.run.outputs.finished }}
          DRAND_ROUND: ${{ steps.seed.outputs.round }}
          DRAND_RANDOMNESS: ${{ steps.seed.outputs.randomness }}
          SEED: ${{ steps.seed.outputs.seed }}
          BENCH_EXIT: ${{ steps.run.outputs.exit }}
          RUNNER_LABEL: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
          SMOKE: ${{ inputs.n != '' || inputs.secs != '' }}
        run: |
          mkdir -p trusted
          jq -n \
            --arg commit "$COMMIT" \
            --argjson pr "$PR_INPUT" \
            --arg started "$STARTED" \
            --arg finished "$FINISHED" \
            --argjson budget_secs "$SECS" \
            --argjson drand_round "${DRAND_ROUND:-null}" \
            --arg drand_randomness "$DRAND_RANDOMNESS" \
            --arg seed "$SEED" \
            --arg runner_label "$RUNNER_LABEL" \
            --arg cpu "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)" \
            --argjson vcpus "$(nproc)" \
            --argjson bench_exit "${BENCH_EXIT:-null}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson smoke "$SMOKE" \
            '{commit: $commit, pr: $pr, started: $started, finished: $finished, budget_secs: $budget_secs,
              drand: {round: $drand_round, randomness: $drand_randomness}, seed: $seed,
              runner: {label: $runner_label, cpu: $cpu, vcpus: $vcpus},
              bench_exit: $bench_exit, run_id: $run_id, run_url: $run_url, smoke: $smoke}' \
            > trusted/meta.json
          # From the object store, never the working tree, and bounded.
          toml=HEAD:submission/SUBMISSION.toml
          if git cat-file -e "$toml" 2>/dev/null && [ "$(git cat-file -s "$toml")" -le 65536 ]; then
            git cat-file blob "$toml" > trusted/SUBMISSION.toml
          fi
          if [ -s trusted/score.json ]; then
            {
              echo "### Submission \`${COMMIT:0:12}\` (PR #$PR)"
              echo
              echo '```'
              jq 'del(.log_profile)' trusted/score.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run
          path: trusted
          if-no-files-found: error
          retention-days: 90

      - name: Report the verdict
        run: test "${{ steps.verify.outputs.status }}" = accepted

  # Records the run, promotes a new record to main, tells the PR and the site.
  # Only from main's copy of this file: a branch exercising `bench` through
  # workflow_call arrives under another event and is skipped here.
  publish:
    needs: bench
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: publish
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
      SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: run
          path: artifact

      - name: Load the records branch
        run: |
          git config user.name "mldsa.fail"
          git config user.email "mldsa.fail@users.noreply.github.com"
          if git fetch --no-tags origin records; then
            git worktree add records origin/records
          else
            git worktree add --detach records
            git -C records checkout --orphan records
            git -C records rm -rfq .
          fi

      - name: Fold the run into the records
        id: fold
        run: |
          pr=$(jq -r .pr artifact/meta.json)
          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json author,title > pr.json
          python3 .github/scripts/publish.py fold artifact records pr.json "${{ vars.PROMOTION_MARGIN_BITS || '0' }}" > decision.json
          jq . decision.json
          {
            echo "pr=$pr"
            echo "promote=$(jq -r .promote decision.json)"
            echo "record_commit=$(jq -r .record_commit decision.json)"
            echo "record_id=$(jq -r .record_id decision.json)"
          } >> "$GITHUB_OUTPUT"
          # A rerun after a failed promotion folds the same artifact to the
          # same bytes; it must still reach the promotion step below.
          cd records
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Run $RUN_ID: PR #$pr, $(jq -r .status ../decision.json)"
          git push origin HEAD:refs/heads/records

      # The record is marked as pending until main actually holds it, so a
      # failed push here is retried by re-running this job instead of
      # leaving the board claiming a promotion that did not happen.
      - name: Promote to main
        if: steps.fold.outputs.promote == 'true'
        env:
          COMMIT: ${{ steps.fold.outputs.record_commit }}
          RECORD_ID: ${{ steps.fold.outputs.record_id }}
        run: |
          git fetch --no-tags origin main "$COMMIT"
          test "$(git rev-list --parents -n 1 "$COMMIT" | wc -w)" -eq 2
          git merge-base --is-ancestor "$COMMIT^" origin/main
          test -z "$(git diff --name-only "$COMMIT^" "$COMMIT" | grep -v '^submission/' || true)"
          git checkout -q main && git reset -q --hard origin/main
          git rm -r -q submission
          git checkout "$COMMIT" -- submission
          git add -A submission
          git diff --cached --quiet || git commit -q -m "Record: run $RECORD_ID" -m "Submission commit $COMMIT."
          git push origin HEAD:main
          python3 .github/scripts/publish.py mark-promoted records "$RECORD_ID"
          cd records
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Run $RECORD_ID is on main"
          git push origin HEAD:refs/heads/records

      - name: Comment on the pull request
        if: always() && steps.fold.outputs.pr != ''
        run: |
          jq -r .comment decision.json > comment.md
          if [ "${{ steps.fold.outputs.promote }}" = true ] && [ "${{ job.status }}" != success ]; then
            echo "Promotion to main did not complete; re-run the publish job to retry it." >> comment.md
          fi
          gh pr comment "${{ steps.fold.outputs.pr }}" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Notify the site
        if: always() && vars.SITE_REPOSITORY != '' && env.SITE_TOKEN != ''
        run: |
          GH_TOKEN="$SITE_TOKEN" gh api "repos/${{ vars.SITE_REPOSITORY }}/dispatches" \
            -f event_type=records-updated -f 'client_payload[run_id]'="$RUN_ID"
